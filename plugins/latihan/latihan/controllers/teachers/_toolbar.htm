<a
    href="<?= Backend::url('latihan/latihan/teachers/create') ?>"
    class="btn btn-primary oc-icon-plus">
    New Teacher
</a>

<button
    type="button"
    class="btn btn-default oc-icon-trash-o toolbar-bulk-action"
    disabled
    id="btnDeleteSelected">
    Delete Selected
</button>

<button
    type="button"
    class="btn btn-default oc-icon-pencil toolbar-bulk-action"
    disabled
    id="btnEditSelected">
    Edit Selected
</button>

<script>
jQuery(function($) {
    var updateUrl = '<?= Backend::url("latihan/latihan/teachers/update") ?>';

    function getListWidget() {
        return $('[data-control="listwidget"]');
    }

    function getCheckedIds() {
        var $list = getListWidget();
        if ($list.length && $list.data('oc.listwidget')) {
            return $list.listWidget('getChecked');
        }
        // Fallback: manual query
        var ids = [];
        $('.list-checkbox input[type="checkbox"]:checked', $list.find('tbody')).each(function() {
            var val = $(this).val();
            if (val && val !== 'on') ids.push(val);
        });
        return ids;
    }

    function toggleBulkButtons() {
        var ids = getCheckedIds();
        var hasSelection = ids.length > 0;
        $('.toolbar-bulk-action').prop('disabled', !hasSelection);
    }

    // Listen for checkbox changes in the list
    $(document).on('change', '.list-checkbox input[type="checkbox"]', function() {
        // Small delay to let the list widget update its state
        setTimeout(toggleBulkButtons, 50);
    });

    // Delete Selected
    $('#btnDeleteSelected').on('click', function() {
        var ids = getCheckedIds();
        if (!ids.length) return;

        if (!confirm('Hapus ' + ids.length + ' data guru yang dipilih?')) return;

        $(this).request('onDelete', {
            data: { checked: ids },
            success: function(data) {
                this.success(data);
                toggleBulkButtons();
            }
        });
    });

    // Edit Selected
    $('#btnEditSelected').on('click', function() {
        var ids = getCheckedIds();
        if (!ids.length) return;
        window.location = updateUrl + '/' + ids[0];
    });

    // Initial state
    toggleBulkButtons();
});
</script>
